services:
  app:
    build:
      context: .
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"
    command: sh -c "php artisan storage:link 2>/dev/null || true && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy

  node:
    image: node:22
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  queue:
    build:
      context: .
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --tries=3
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: openmodhub
      DB_USERNAME: openmodhub
      DB_PASSWORD: openmodhub
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - queue

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: openmodhub
      MARIADB_USER: openmodhub
      MARIADB_PASSWORD: openmodhub
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
